name: traffic-pitr

services:
  db:
    image: postgres:16-bookworm
    container_name: traffic-pitr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic
      TZ: UTC
    command:
      - postgres
      - -c
      - "listen_addresses=*"
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      # atomic, size-checked archiving: short files never get published and
      # can be re-archived from the still-present source WAL (see script).
      - archive_command=/archiver/safe_archive.sh %p %f
      - -c
      - archive_timeout=10
      - -c
      - max_wal_senders=4
      - -c
      - wal_keep_size=256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # safe archive_command implementation
      - ./db/archiver:/archiver:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  api:
    build: ./api
    container_name: traffic-pitr-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: traffic
      TZ: UTC
      # replica postgres refuses to run as root; the api container runs as root
      # and drops to this user (via gosu) only for the replica postmaster.
      REPLICA_RUN_AS: postgres
      # read-only view of the source pg_wal, used only to re-archive leftover
      # short files while the source WAL segment still exists.
      SOURCE_PG_WAL: /source_pgdata/pg_wal
    volumes:
      - wal_archive:/wal_archive
      - backups:/backups
      - recovery_work:/recovery_work
      - api_state:/state
      - pgdata:/source_pgdata:ro
    ports:
      - "8000:8000"

volumes:
  pgdata:
  wal_archive:
  backups:
  recovery_work:
  api_state:
